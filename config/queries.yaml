  - id: DEEP-001
    category: deep_research
    query: "Impact of CSRD on non-EU companies supply chain reporting Scope 3 emissions data availability challenges 2024"
    expected_loss: true
  - id: DEEP-002
    category: deep_research
    query: "Generative AI ROI enterprise deployments 2023 2024 measurable productivity gains cost savings case studies"
  - id: DEEP-003
    category: deep_research
    query: "Climate transition risk banking portfolio alignment Paris Agreement NZBA PCAF methodology 2024"
  - id: DEEP-004
    category: deep_research
    query: "Quantum computing threat timeline RSA ECC cryptography migration post-quantum NIST standards 2024 enterprise readiness"
  - id: DEEP-005
    category: deep_research
    query: "Green hydrogen cost parity forecasts 2030 2040 electrolyzer CAPEX renewable LCOE regional analysis Europe Middle East Australia"