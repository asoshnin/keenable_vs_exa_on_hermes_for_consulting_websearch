<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Search Backend Benchmark</title>
<style>
  :root{
    --ink:#111827; --muted:#6b7280; --line:#e5e7eb; --bg:#ffffff;
    --panel:#f9fafb; --accent:#0f766e; --warn:#b45309; --bad:#b91c1c;
  }
  *{box-sizing:border-box}
  body{
    margin:0; background:var(--bg); color:var(--ink);
    font:16px/1.62 -apple-system,BlinkMacSystemFont,"Segoe UI",Inter,Roboto,Helvetica,Arial,sans-serif;
    -webkit-font-smoothing:antialiased;
  }
  .wrap{max-width:960px;margin:0 auto;padding:56px 32px 96px}
  h1{font-size:2rem;line-height:1.2;letter-spacing:-.02em;margin:0 0 .3em;font-weight:750}
  h2{font-size:1.32rem;letter-spacing:-.01em;margin:2.4em 0 .6em;padding-bottom:.32em;
     border-bottom:2px solid var(--line);font-weight:700}
  h3{font-size:1.06rem;margin:1.8em 0 .5em;font-weight:650}
  h4{font-size:.98rem;margin:1.4em 0 .4em;font-weight:650;color:var(--muted)}
  p,li{color:#1f2937}
  a{color:var(--accent);text-decoration:none;border-bottom:1px solid rgba(15,118,110,.3)}
  a:hover{border-bottom-color:var(--accent)}
  code{background:#f3f4f6;padding:.12em .38em;border-radius:4px;font-size:.88em;
       font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}
  pre{background:#0f172a;color:#e2e8f0;padding:16px 18px;border-radius:8px;overflow-x:auto;
      font-size:.84rem;line-height:1.5}
  pre code{background:none;color:inherit;padding:0}
  blockquote{margin:1.2em 0;padding:.85em 1.1em;background:var(--panel);
             border-left:3px solid var(--accent);border-radius:0 6px 6px 0;color:#374151}
  blockquote p{margin:.35em 0}
  table{width:100%;border-collapse:collapse;margin:1.1em 0;font-size:.88rem;
        font-variant-numeric:tabular-nums}
  caption{caption-side:top;text-align:left;font-size:.8rem;color:var(--muted);
          padding-bottom:.5em;font-style:italic}
  th,td{padding:9px 11px;border-bottom:1px solid var(--line);text-align:left;vertical-align:top}
  thead th{background:var(--panel);font-weight:650;font-size:.82rem;text-transform:uppercase;
           letter-spacing:.03em;color:#374151;border-bottom:2px solid var(--line)}
  tbody tr:hover{background:#fcfcfd}
  td:first-child{white-space:nowrap}
  hr{border:0;border-top:1px solid var(--line);margin:2.6em 0}
  strong{font-weight:670}
  ul,ol{padding-left:1.35em}
  li{margin:.3em 0}
  .doc-title{color:var(--muted);font-size:1.02rem;margin:0 0 2.2em;font-weight:400}
</style>
</head>
<body>
<div class="wrap">
__BODY__
</div>
</body>
</html>
